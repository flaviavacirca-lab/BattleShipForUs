<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship Date Night</title>
  <meta name="theme-color" content="#1a1a2e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚢</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Battleship Date Night</h1>
    <p class="subtitle">Sink ships. Ask questions. Get closer.</p>
  </div>

  <!-- Turn Indicator -->
  <div class="turn-indicator turn-d" id="turn-indicator">D's Turn</div>

  <!-- Floating message -->
  <div class="float-message" id="float-message"></div>

  <!-- Game Boards -->
  <div class="game-area">
    <div class="board-section" id="section-d">
      <div class="board-label">D's Fleet</div>
      <div id="board-d"></div>
      <div class="ship-list" id="ships-d"></div>
    </div>
    <div class="board-section" id="section-f">
      <div class="board-label">F's Fleet</div>
      <div id="board-f"></div>
      <div class="ship-list" id="ships-f"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-bar">
    <button class="ctrl-btn" onclick="newGame()">New Game</button>
    <button class="ctrl-btn" onclick="resetPlayerD()">Reset D's Questions</button>
    <button class="ctrl-btn" onclick="resetPlayerF()">Reset F's Questions</button>
    <button class="ctrl-btn" onclick="resetAllProgress()">Reset All Progress</button>
    <button class="sound-btn" id="sound-toggle" onclick="toggleSound()">🔊</button>
  </div>

  <!-- Stats -->
  <div class="stats-area">
    <div class="stats-panel">
      <h3>D's Question Progress</h3>
      <div id="stats-d"></div>
    </div>
    <div class="stats-panel">
      <h3>F's Question Progress</h3>
      <div id="stats-f"></div>
    </div>
  </div>

  <!-- Question Modal -->
  <div class="modal-overlay hidden" id="question-modal">
    <div class="modal-content" id="modal-content-inner"></div>
  </div>

  <!-- Game Over Overlay -->
  <div class="game-over-overlay hidden" id="game-over-overlay">
    <h2>Game Over!</h2>
    <p id="winner-text"></p>
    <button onclick="init()">Play Again</button>
  </div>

  <!-- Scripts -->
  <script src="questions.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>

</body>
</html>
